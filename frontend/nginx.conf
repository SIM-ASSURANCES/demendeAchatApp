server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Application React (React Router) : toute route inconnue de nginx retombe sur index.html,
    # laissant le routeur côté client décider — sans ça, un rafraîchissement sur /espace/demandes
    # renverrait un 404 nginx au lieu de la page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.png {
        expires 30d;
    }
}
